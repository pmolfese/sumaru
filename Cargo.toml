[package]
name = "sumaru"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "A Rust rebuild of AFNI SUMA."
license-file = "LICENSE"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
flate2 = "1.1"
gifti_rs = { package = "gifti-rs", git = "https://github.com/PennLINC/gifti-rs" }
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
nifti = { version = "0.18", features = ["nalgebra_affine"] }
pollster = "1"
rfd = "0.17"
rustfft = "6"
wgpu = "30"
winit = "0.30"

[lints.rust]
unsafe_code = "forbid"
